<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tirage au sort - Festival Mots-Zik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 500px;
        }

        h1 {
            font-size: 1.15rem;
            line-height: 1.4;
            color: #58a6ff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-action {
            background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
            box-shadow: 0 4px 20px rgba(31, 111, 235, 0.5);
            font-size: 1.15rem;
            padding: 16px;
            letter-spacing: 0.5px;
        }

        /* Roulette Container */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 140px;
            background: #161b22;
            border-radius: 16px;
            border: 2px solid #30363d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .roulette-window {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roulette-items {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .roulette-item {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 500;
            color: #8b949e;
            width: 100%;
            text-align: center;
            padding: 0 60px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fixed Center Winning Line (Stable, no bouncing) */
        .winning-line-container {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 46px;
            border-top: 2px solid rgba(88, 166, 255, 0.4);
            border-bottom: 2px solid rgba(88, 166, 255, 0.4);
            background: rgba(88, 166, 255, 0.05);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 10;
        }

        .winning-line-container.glow {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.2);
            box-shadow: 0 0 20px #58a6ff, inset 0 0 15px #58a6ff;
            animation: linePulse 1s infinite alternate;
        }

        @keyframes linePulse {
            from { box-shadow: 0 0 10px #58a6ff, inset 0 0 10px #58a6ff; }
            to { box-shadow: 0 0 25px #58a6ff, inset 0 0 20px #58a6ff; }
        }

        /* Logos on sides of the winning line (only they bounce) */
        .side-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
            background: #000;
        }

        .side-logo.bouncing {
            animation: logoBounce 0.2s infinite alternate;
        }

        @keyframes logoBounce {
            0% { transform: translateY(-3px) scale(1.05); }
            100% { transform: translateY(3px) scale(0.95); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* Modal Popup for participants */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            font-size: 1.2rem;
            color: #c9d1d9;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .participant-count {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .winner-announcement {
            margin-top: 10px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #3fb950;
            min-height: 40px;
            text-shadow: 0 0 10px rgba(63, 185, 80, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>Qui va gagner 2 places pour la soirée du vendredi 6 novembre au festival Mots-Zik ?</h1>
    </header>

    <div class="container">
        <button class="btn-primary" id="btn-open-modal">Ajouter les participants</button>

        <div class="roulette-wrapper">
            <div class="winning-line-container" id="winningLine">
                <img src="chat_tete.png" alt="Logo" class="side-logo" id="logoLeft">
                <img src="chat_tete.png" alt="Logo" class="side-logo" id="logoRight">
            </div>
            <div class="roulette-window">
                <div class="roulette-items" id="rouletteItems">
                    <div class="roulette-item">Ajoutez des participants
