<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tirage au sort - Festival Mots-Zik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #080b0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 25px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 500px;
        }

        h1 {
            font-size: 1.45rem;
            line-height: 1.4;
            color: #79c0ff;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(121, 192, 255, 0.5), 0 0 5px rgba(88, 166, 255, 0.8);
            letter-spacing: 0.3px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-action {
            background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
            box-shadow: 0 4px 20px rgba(31, 111, 235, 0.5);
            font-size: 1.15rem;
            padding: 16px;
        }

        /* Conteneur de la roulette avec Perspective 3D */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 140px;
            background: #161b22;
            border-radius: 16px;
            border: 2px solid #30363d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            perspective: 600px;
        }

        .roulette-window {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .roulette-items {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            transform-style: preserve-3d;
        }

        .roulette-item {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 500;
            color: #8b949e;
            width: 100%;
            text-align: center;
            padding: 0 60px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backface-visibility: hidden;
        }

        .winning-line-container {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 46px;
            border-top: 2px solid rgba(88, 166, 255, 0.4);
            border-bottom: 2px solid rgba(88, 166, 255, 0.4);
            background: rgba(88, 166, 255, 0.05);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 10;
        }

        .winning-line-container.glow {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.2);
            box-shadow: 0 0 20px #58a6ff, inset 0 0 15px #58a6ff;
            animation: linePulse 1s infinite alternate;
        }

        @keyframes linePulse {
            from { box-shadow: 0 0 10px #58a6ff, inset 0 0 10px #58a6ff; }
            to { box-shadow: 0 0 25px #58a6ff, inset 0 0 20px #58a6ff; }
        }

        .side-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
            background: #000;
        }

        .side-logo.bouncing {
            animation: logoBounce 0.2s infinite alternate;
        }

        @keyframes logoBounce {
            0% { transform: translateY(-3px) scale(1.05); }
            100% { transform: translateY(3px) scale(0.95); }
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-content h2 {
            font-size: 1.2rem;
            color: #c9d1d9;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
        }

        .participant-count {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .winner-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .winner-popup.active {
            display: flex;
        }

            background: linear-gradient(145deg, #16
