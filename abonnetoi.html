<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Abonne-toi ! | Good Morning Roger</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="/chat_tete.png">
    <link rel="apple-touch-icon" href="/chat_tete.png">

    <style>
        @font-face {
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('fonts/bebas-neue-v16-latin-regular.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Roboto';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('fonts/robotov51-latin-regular.woff2') format('woff2');
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 20px 15px;
            font-family: 'Roboto', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* --- LOGO, MASCOTTE POP & SURLIGNAGE --- */
        .logo-wrapper {
            position: relative;
            max-width: 320px;
            margin: 30px auto 20px auto;
            cursor: pointer;
        }
        .logo-groupe-principal {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 0px 15px rgba(18, 195, 255, 0.4));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
            position: relative;
            z-index: 2;
        }
        .mascotte-pop {
            position: absolute;
            top: -50px;
            left: 60%;
            width: 110px;
            height: auto;
            transform: rotate(-15deg) scale(0); 
            opacity: 0;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0px 0px 15px rgba(18, 195, 255, 0.5));
        }
        .logo-wrapper:hover .logo-groupe-principal {
            transform: scale(1.08) rotate(3deg);
            filter: drop-shadow(0px 0px 25px rgba(18, 195, 255, 0.7));
        }
        .logo-wrapper:hover .mascotte-pop {
            opacity: 1;
            transform: rotate(15deg) scale(1);
        }

        /* Titre principal */
        h1 {
            font-family: 'Bebas Neue', Impact, sans-serif;
            font-size: 2.2rem;
            color: #12C3FF;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0 10px 0;
            text-shadow: 0 0 12px rgba(18, 195, 255, 0.4);
            line-height: 1.2;
        }

        /* Message d'encouragement sous le titre */
        .call-to-action {
            font-family: 'Bebas Neue', Impact, sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .cta-sub {
            color: #12C3FF;
            font-size: 2rem;
            display: block;
            margin-top: 2px;
        }

        /* Liste de boutons */
        .grid-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 35px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 20px;
            text-decoration: none;
            color: #ffffff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(18, 195, 255, 0.15);
            border-color: #12C3FF;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(18, 195, 255, 0.4);
        }

        .link-btn img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-right: 15px;
        }

        footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Logo du groupe avec Mascotte Pop & Surlignage -->
    <a href="https://goodmorningroger.fr" style="text-decoration: none;">
        <div class="logo-wrapper">
            <img src="Goodmorningrogerlogo.png" class="logo-groupe-principal" alt="Good Morning Roger - Groupe de Punk Rock Covers">
            <img src="rogerchat.png" class="mascotte-pop" alt="Roger le Chat">
        </div>
    </a>

    <!-- Titre principal -->
    <h1>Découvre Good Morning Roger<br>sur tous les réseaux</h1>

    <!-- Message d'encouragement sous le titre -->
    <div class="call-to-action">
        Donne-nous de la force
        <span class="cta-sub">et abonne-toi ! 🔥</span>
    </div>

    <!-- Liste des liens -->
    <div class="grid-links">
        
        <!-- Réseaux Sociaux -->
        <a href="https://www.instagram.com/goodmorningroger/" target="_blank" class="link-btn">
            <img src="logoinsta.png" alt="Instagram"> Instagram
        </a>

        <a href="https://www.facebook.com/GoodMorningRoger/" target="_blank" class="link-btn">
            <img src="logofb.png" alt="Facebook"> Facebook
        </a>

        <a href="https://www.tiktok.com/@good.morning.roger" target="_blank" class="link-btn">
            <img src="logotiktok.png" alt="TikTok"> TikTok
        </a>

        <a href="https://www.youtube.com/@goodmorningroger" target="_blank" class="link-btn">
            <img src="logoyoutube.png" alt="YouTube"> YouTube
        </a>

        <!-- Streaming -->
        <a href="https://open.spotify.com/intl-fr/artist/4G8tJAXMrv57k3GlfhEjsX" target="_blank" class="link-btn">
            <img src="logospot.png" alt="Spotify"> Spotify
        </a>

        <a href="https://www.deezer.com/fr/artist/248006762" target="_blank" class="link-btn">
            <img src="logodeezer.png" alt="Deezer"> Deezer
        </a>

        <a href="https://music.apple.com/fr/artist/good-morning-roger/1722583151" target="_blank" class="link-btn">
            <img src="logoapple.png" alt="Apple Music"> Apple Music
        </a>

        <a href="https://music.amazon.fr/artists/B0CQTXV21G/good-morning-roger" target="_blank" class="link-btn">
            <img src="logoamazon.png" alt="Amazon Music"> Amazon Music
        </a>

        <a href="https://goodmorningroger.bandcamp.com/" target="_blank" class="link-btn">
            <img src="logobandcamp.png" alt="Bandcamp"> Bandcamp
        </a>

    </div>

    <footer>
        © 2026 GOOD MORNING ROGER
    </footer>

</body>
</html>
