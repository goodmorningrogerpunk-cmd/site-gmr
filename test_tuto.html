<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Skate Cat - Tutoriel Officiel Définitif</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #fff; overflow: hidden; touch-action: none !important; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    #game-container {
      position: relative; width: 100%; max-width: 960px; height: 100%; max-height: 540px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); border-radius: 12px; overflow: hidden; border: 4px solid #2e2e40; background: #000;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: pixelated; }

    .pixel-btn { font-family: 'Courier New', Courier, monospace; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.1s ease; z-index: 25; }
    
    #tuto-main-btn {
      position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%);
      padding: 16px 32px; font-size: 20px; color: #ffffff; background-color: #2e2e40;
      border: 3px solid #ffd54f; box-shadow: 0 4px 0px #000; z-index: 30;
    }
    #tuto-main-btn:hover { background-color: #ffd54f; color: #1a1a24; }

    #version-display {
      position: absolute; bottom: 12px; right: 15px; font-size: 13px; font-weight: bold;
      color: #ffd54f; background: rgba(0, 0, 0, 0.75); padding: 4px 8px; border: 1px solid #ffd54f;
      border-radius: 4px; pointer-events: none; z-index: 30;
    }

    #tuto-dialog-box {
      display: none; position: absolute; width: 440px; min-height: 190px; background: #111118; border: 4px solid #ffd54f; border-radius: 8px;
      padding: 34px 24px 24px 24px; z-index: 65000; text-align: center; box-shadow: 0 0 35px rgba(0,0,0,0.95);
    }
    #tuto-dialog-text { font-size: 13px; line-height: 2.2; color: #ffffff; margin-top: 10px; margin-bottom: 20px; text-align: left; display: block; }
    #tuto-next-btn { padding: 8px 24px; font-size: 15px; color: #1a1a24; background-color: #ffd54f; border: 3px solid #ffffff; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <button id="tuto-main-btn" class="pixel-btn">LANCER LE TUTORIEL</button>
  <div id="version-display">v11.0-FINAL</div>

  <div id="tuto-dialog-box">
    <p id="tuto-dialog-text"></p>
    <button id="tuto-next-btn" class="pixel-btn">SUIVANT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
ctx.webkitImageSmoothingEnabled = false;

const tutoMainBtn = document.getElementById('tuto-main-btn');
const tutoDialogBox = document.getElementById('tuto-dialog-box');
const tutoDialogText = document.getElementById('tuto-dialog-text');
const tutoNextBtn = document.getElementById('tuto-next-btn');

const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                 || (window.matchMedia && window.matchMedia("(max-width: 900px) and (pointer: coarse)").matches);

const bgMusic = new Audio('roger_8bitok.mp3'); bgMusic.loop = true; bgMusic.volume = 0.8;
const sounds = {
  run: new Audio('skate_run.mp3'), jump: new Audio('skate_jump.mp3'), reception: new Audio('skate_reception.mp3'),
  coin: new Audio('coin_receive.mp3'), damage: new Audio('damage.mp3')
};
sounds.run.loop = true; sounds.run.volume = 0.6; sounds.jump.volume = 0.7; sounds.reception.volume = 0.7;
sounds.coin.volume = 0.8; sounds.damage.volume = 0.85;

let audioUnlocked = false;
function unlockAudio() {
  if (!audioUnlocked) {
    sounds.run.play().then(() => { sounds.run.pause(); audioUnlocked = true; }).catch(() => {});
  }
}
function playRunSound() {
  if (!audioUnlocked || !gameStarted || tutoHighlightedZone) { stopRunSound(); return; }
  if (sounds.run.paused) sounds.run.play().catch(() => {});
}
function stopRunSound() { if (!sounds.run.paused) { sounds.run.pause(); if (sounds.run.readyState >= 2) sounds.run.currentTime = 0; } }
function playSoundEffect(sound) { if (audioUnlocked) { try { if (sound.readyState >= 2) sound.currentTime = 0; sound.play().catch(() => {}); } catch(e) {} } }

const ASSET_VERSION = 'v11.0';
function loadSmartImage(baseName) {
  const img = new Image(); const extensions = ['png', 'jpg', 'jpeg', 'PNG', 'JPG']; let extIdx = 0;
  img.onerror = () => { extIdx++; if (extIdx < extensions.length) img.src = `${baseName}.${extensions[extIdx]}?v=${ASSET_VERSION}`; };
  img.src = `${baseName}.${extensions[0]}?v=${ASSET_VERSION}`; return img;
}

const assets = {
  bg: loadSmartImage('background4'),
  cat: {
    runSequence: [loadSmartImage('chat_push2'), loadSmartImage('chat_run'), loadSmartImage('chat_run1'), loadSmartImage('chat_run3')],
    run4: loadSmartImage('chat_run4'), jump: [loadSmartImage('chat_jump1'), loadSmartImage('chat_jump2'), loadSmartImage('chat_jump3')],
    crouchSequence: [loadSmartImage('chat_reception2'), loadSmartImage('chat_reception2-1'), loadSmartImage('chat_reception2-2')],
    crouchAir: loadSmartImage('chat_reception2 - Copie'), fail: loadSmartImage('chat_fail')
  },
  platforms: {
    bleu_short: loadSmartImage('bleu_short'), bleu_medium: loadSmartImage('bleu_medium'), bleu_long: loadSmartImage('bleu_long'),
    rouge_short: loadSmartImage('rouge_short'), rouge_medium: loadSmartImage('rouge_medium'), rouge_long: loadSmartImage('rouge_long'),
    vert_short: loadSmartImage('vert_short'), vert_medium: loadSmartImage('vert_medium'), vert_long: loadSmartImage('vert_long')
  },
  obstaclesConfig: [
    { type: 'anim', frames: [loadSmartImage('obstacle_jl1'), loadSmartImage('obstacle_jl2'), loadSmartImage('obstacle_jl3')], targetH: 150 },
    { type: 'anim', frames: [loadSmartImage('obstacle_marc1'), loadSmartImage('obstacle_marc2'), loadSmartImage('obstacle_marc3')], targetH: 150 },
    { type: 'air', img: loadSmartImage('obstacle3'), targetW: 120 },
    { type: 'plat', img: loadSmartImage('obstacle1'), targetH: 100 },
    { type: 'plat', img: loadSmartImage('obstacle2'), targetH: 140 },
    { type: 'ground', img: loadSmartImage('obstacle4'), targetH: 75 },
    { type: 'ground', img: loadSmartImage('obstacle5'), targetH: 80 },
    { type: 'air', img: loadSmartImage('obstacle6'), targetH: 85 }
  ],
  letters: {
    R: Array.from({length: 8}, (_, i) => loadSmartImage(`R${i+1}`)),
    O: Array.from({length: 8}, (_, i) => loadSmartImage(`O${i+1}`)),
    G: Array.from({length: 8}, (_, i) => loadSmartImage(`G${i+1}`)),
    E: Array.from({length: 8}, (_, i) => loadSmartImage(`E${i+1}`))
  }
};

function getObstacleDimensions(conf) {
  const sampleImg = (conf.type === 'anim') ? conf.frames[0] : conf.img;
  let w = conf.targetW || 100, h = conf.targetH || 100;
  if (sampleImg && sampleImg.complete && sampleImg.naturalWidth > 0 && sampleImg.naturalHeight > 0) {
    const ratio = sampleImg.naturalWidth / sampleImg.naturalHeight;
    if (conf.targetH) { h = conf.targetH; w = h * ratio; }
    else if (conf.targetW) { w = conf.targetW; h = w / ratio; }
  }
  return { w, h };
}

const BASE_GAME_SPEED = 6.5;
let currentGameSpeed = BASE_GAME_SPEED;
const GROUND_Y = 430; const ENTITY_GROUND_Y = 418; const GRAVITY = 0.8;
const JUMP_FORCE = -12; const JUMP_HOLD_FORCE = -0.55; const MAX_JUMP_TIME = 15;

let bgX = 0; let score = 0; let gameStarted = false; let lastScoreTime = Date.now();
const rogerLetters = ['R', 'O', 'G', 'E', 'R'];
let rogerCollected = [false, false, false, false, false];
let completedWordsCount = 2; 

const cat = { x: 100, y: ENTITY_GROUND_Y - 110, width: 110, height: 110, vy: 0, isGrounded: true, wasGrounded: true, isPlatformGrounded: false, isCrouching: false, jumpTimer: 0, isJumping: false, animFrame: 0, animTimer: 0, crouchFrame: 0, crouchTimer: 0, state: 'RUN', damageFlashTimer: 0 };
let platforms = []; let obstacles = []; let items = []; let keys = {};
let bounceTimer = 0;

let tutoStep = 0;
let tutoTimer = 0;
let tutoHighlightedZone = null;
let tutoInstructionMessage = "";
let tutoSubState = 0;
let tutoObstacleCount = 0;
let tutoNextCallback = null;
let customLetterSpawnIndex = 0;
let endSequenceTimer = 0;

function showTutoDialogSide(text, highlightRect, onNext) {
  tutoDialogText.innerHTML = text;
  tutoHighlightedZone = highlightRect;
  tutoNextCallback = onNext;
  
  tutoDialogBox.style.display = 'block';

  // Si highlightRect est null, on centre la fenêtre parfaitement au milieu de l'écran
  if (!highlightRect) {
    tutoDialogBox.style.left = '50%';
    tutoDialogBox.style.top = '50%';
    tutoDialogBox.style.transform = 'translate(-50%, -50%)';
    return;
  }

  let leftPos = highlightRect.x + highlightRect.w + 20;
  if (leftPos + 440 > canvas.width) leftPos = highlightRect.x - 460;
  if (leftPos < 20) leftPos = 20;

  let topPos = highlightRect.y - 10;
  if (topPos < 50) topPos = 50;
  if (topPos + 280 > canvas.height) topPos = canvas.height - 300;

  tutoDialogBox.style.left = leftPos + 'px';
  tutoDialogBox.style.top = topPos + 'px';
  tutoDialogBox.style.transform = 'none';
}

tutoNextBtn.addEventListener('click', () => {
  tutoDialogBox.style.display = 'none';
  tutoHighlightedZone = null;
  if (tutoNextCallback) {
    const cb = tutoNextCallback; tutoNextCallback = null; cb();
  }
});

window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  unlockAudio();
  if (tutoDialogBox.style.display === 'block' && (e.code === 'Space' || e.code === 'Enter')) {
    tutoNextBtn.click();
    return;
  }
  keys[e.code] = true;
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp') { cat.isJumping = false; }
});

function handleTouchAction(e, isTouchStart) {
  if (tutoHighlightedZone) return;
  if (!isTouchStart) { keys['ArrowDown'] = false; keys['Space'] = false; keys['ArrowUp'] = false; cat.isJumping = false; return; }
  const viewportWidth = window.innerWidth; let wantDown = false; let wantJump = false;
  for (let i = 0; i < e.touches.length; i++) {
    const touch = e.touches[i]; const clientX = touch.clientX;
    if (clientX < viewportWidth / 2) wantDown = true; else wantJump = true;
  }
  keys['ArrowDown'] = wantDown; keys['Space'] = wantJump; keys['ArrowUp'] = wantJump;
}

document.addEventListener('touchstart', (e) => {
  if (e.target.closest('#tuto-main-btn') || e.target.closest('#tuto-dialog-box')) return;
  e.preventDefault(); unlockAudio(); handleTouchAction(e, true);
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (e.target.closest('#tuto-main-btn') || e.target.closest('#tuto-dialog-box')) return;
  e.preventDefault(); handleTouchAction(e, false);
}, { passive: false });

tutoMainBtn.addEventListener('click', () => {
  unlockAudio(); bgMusic.play().catch(() => {});
  tutoMainBtn.style.display = 'none';
  gameStarted = true;
  startTutorial();
});

function startTutorial() {
  tutoStep = 1;
  tutoTimer = 0;
  tutoSubState = 0;
  tutoObstacleCount = 0;
  tutoInstructionMessage = "";
  tutoHighlightedZone = null;
  completedWordsCount = 2;
  platforms = []; obstacles = []; items = [];
  cat.y = ENTITY_GROUND_Y - cat.height; cat.vy = 0; cat.isGrounded = true;
}

// LOGIQUE DU TUTORIEL SCRIPTÉ
function updateTutorialScript() {
  if (tutoHighlightedZone) return;
  tutoTimer++;

  if (tutoStep === 1) {
    if (tutoTimer > 60) {
      showTutoDialogSide(
        "Ceci est ton score, le but est d'avoir le maximum de points. Plus tu avances loin, plus ton score augmente. Des bonus peuvent aussi te faire gagner des points.",
        { x: 15, y: 15, w: 230, h: 55 },
        () => { tutoStep = 2; tutoTimer = 0; }
      );
    }
  }
  else if (tutoStep === 2) {
    if (tutoTimer > 30) {
      const controlsText = isMobileDevice ?
        "En appuyant sur le CÔTÉ DROIT DE L'ÉCRAN, Roger fait un saut. En appuyant sur le CÔTÉ GAUCHE, Roger se baisse." :
        "En appuyant sur ESPACE, Roger fait un saut. En appuyant sur la FLÈCHE DU BAS, Roger se baisse. Pour mettre le jeu en pause, appuie sur ENTRÉE.";

      const hudX = isMobileDevice ? canvas.width - 370 : canvas.width - 340;
      showTutoDialogSide(
        controlsText,
        { x: hudX, y: 15, w: 320, h: 80 },
        () => { tutoStep = 3; tutoSubState = 1; tutoTimer = 0; }
      );
    }
  }
  else if (tutoStep === 3) {
    if (tutoSubState === 1) {
      tutoInstructionMessage = "Vas-y fais un long saut (appui long sur ESPACE)";
      if (!cat.isGrounded && cat.jumpTimer >= 10) { tutoSubState = 2; tutoTimer = 0; }
    } else if (tutoSubState === 2) {
      tutoInstructionMessage = "Maintenant, baisse-toi (FLÈCHE DU BAS)";
      if (cat.isCrouching) { tutoSubState = 3; tutoTimer = 0; }
    } else if (tutoSubState === 3) {
      tutoInstructionMessage = "Et pour finir, fais un tout petit saut (appui court sur ESPACE)";
      if (cat.vy < 0 && cat.jumpTimer < 5 && !keys['Space'] && !keys['ArrowUp']) {
        tutoStep = 4; tutoTimer = 0; tutoSubState = 1; tutoInstructionMessage = "";
      }
    }
  }
  else if (tutoStep === 4) {
    const plat = platforms[0];
    if (plat && plat.x <= canvas.width - 350 && tutoSubState === 1 && !plat.shownPopup) {
      plat.shownPopup = true;
      showTutoDialogSide(
        "Ceci est une plateforme, il en existe de différentes tailles et hauteurs. Tu peux sauter dessus ou passer au travers.",
        { x: plat.x, y: plat.y, w: plat.w, h: plat.h },
        () => { tutoSubState = 2; }
      );
    }

    if (tutoSubState === 2) {
      tutoInstructionMessage = "Vas-y, saute sur une plateforme";
      if (cat.isPlatformGrounded) { tutoSubState = 3; }
    } else if (tutoSubState === 3) {
      tutoInstructionMessage = "Maintenant, saute sur une plateforme et descends avec la FLÈCHE DU BAS";
      const pLong = platforms[0];
      if (pLong) {
        if (cat.isPlatformGrounded) pLong.wasOnPlat = true;
        if (pLong.wasOnPlat && cat.isCrouching && !cat.isPlatformGrounded && cat.y + cat.height < ENTITY_GROUND_Y) {
          pLong.descendedFromPlat = true;
        }
        if (pLong.descendedFromPlat && cat.isGrounded) { tutoSubState = 4; }
      }
    } else if (tutoSubState === 4) {
      tutoInstructionMessage = "Enfin, saute et passe au travers en appuyant sur ESPACE puis BAS";
      const pPass = platforms[0];
      if (pPass) {
        if (cat.isPlatformGrounded) { pPass.touchedPlatform = true; }
        const surfaceY = pPass.y + 14;
        if (!pPass.touchedPlatform && cat.isCrouching && cat.vy > 0 && cat.x + cat.width > pPass.x && cat.x < pPass.x + pPass.w && cat.y + cat.height >= surfaceY && cat.y < surfaceY) {
          tutoStep = 5; tutoTimer = 0; tutoSubState = 0; platforms = []; tutoInstructionMessage = "";
        }
      }
    }
  }
  else if (tutoStep === 5) {
    if (tutoSubState === 0) {
      if (tutoTimer > 120) {
        if (obstacles.length === 0) {
          const conf = assets.obstaclesConfig[5]; const dim = getObstacleDimensions(conf);
          obstacles.push({ x: canvas.width + 100, y: ENTITY_GROUND_Y - dim.h + 5, w: dim.w, h: dim.h, configIdx: 5, frame: 0, animTimer: 0 });
        }
        const obs = obstacles[0];
        if (obs && obs.x <= canvas.width - 350 && !obs.shownPopup) {
          obs.shownPopup = true;
          tutoSubState = 1;
          showTutoDialogSide(
            "Ça c'est un obstacle, il faut l'éviter en sautant par-dessus ou en passant en dessous.",
            { x: obs.x, y: obs.y, w: obs.w, h: obs.h },
            () => { tutoSubState = 2; tutoObstacleCount = 0; tutoTimer = 0; }
          );
        }
      }
    } else if (tutoSubState === 2) {
      tutoInstructionMessage = `Évite les obstacles ! (${tutoObstacleCount}/4)`;
      if (obstacles.length === 0 && tutoTimer > 60) {
        tutoTimer = 0;
        let configIdx = 5;
        if (tutoObstacleCount === 1) configIdx = 3; 
        else if (tutoObstacleCount === 2) configIdx = 4; 
        else if (tutoObstacleCount === 3) configIdx = 7; 

        const conf = assets.obstaclesConfig[configIdx]; const dim = getObstacleDimensions(conf);
        let obsY = ENTITY_GROUND_Y - dim.h + 5;
        
        if (configIdx === 7) {
          obsY = ENTITY_GROUND_Y - dim.h - 70;
        } else if (configIdx === 3) {
          obsY = ENTITY_GROUND_Y - 100 - dim.h + 20;
          platforms.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 100, w: 260, h: 65, key: 'bleu_medium' });
        } else if (configIdx === 4) {
          obsY = ENTITY_GROUND_Y - dim.h + 5;
        }
        
        obstacles.push({ x: canvas.width + 100, y: obsY, w: dim.w, h: dim.h, configIdx, frame: 0, animTimer: 0, baseY: obsY });
      }

      if (obstacles.length > 0) {
        const cur = obstacles[0];
        if (cur.x + cur.w < cat.x && !cur.passed) {
          cur.passed = true;
          tutoObstacleCount++;
          if (tutoObstacleCount >= 4) {
            tutoStep = 6; tutoSubState = 0; tutoTimer = 0; obstacles = []; platforms = []; tutoInstructionMessage = "";
          }
        }
      }
    }
  }
  else if (tutoStep === 6) {
    if (tutoSubState === 0) {
      showTutoDialogSide(
        "Ces grosses lettres R O G E R te protègent d'un choc avec un obstacle.",
        { x: 15, y: canvas.height - 130, w: 200, h: 110 },
        () => { tutoSubState = 1; }
      );
    } else if (tutoSubState === 1) {
      tutoInstructionMessage = "Vas-y fonce sur un obstacle pour tester la protection !";
      if (obstacles.length === 0 && tutoTimer > 40) {
        const conf = assets.obstaclesConfig[5]; const dim = getObstacleDimensions(conf);
        obstacles.push({ x: canvas.width + 100, y: ENTITY_GROUND_Y - dim.h + 5, w: dim.w, h: dim.h, configIdx: 5, frame: 0, animTimer: 0 });
      }
      if (completedWordsCount === 1 && tutoSubState === 1) {
        tutoSubState = 2;
        tutoTimer = 0;
        obstacles = [];
        showTutoDialogSide(
          "Tu vois, en percutant un obstacle la lettre O t'a protégé. Si tu n'as plus de lettres pour te protéger, c'est le Game Over assuré !",
          { x: 15, y: canvas.height - 130, w: 105, h: 110 },
          () => {
            tutoSubState = 3;
            tutoTimer = 0;
          }
        );
      }
    } else if (tutoSubState === 3) {
      if (tutoTimer > 60) {
        tutoStep = 7; tutoSubState = 0; tutoTimer = 0; customLetterSpawnIndex = 0;
      }
    }
  }
  else if (tutoStep === 7) {
    if (tutoSubState === 0) {
      showTutoDialogSide(
        "Collecte ces lettres afin de compléter le mot R O G E R en bas à droite, cela te fera gagner une grosse lettre.",
        { x: canvas.width - 340, y: canvas.height - 95, w: 320, h: 85 },
        () => { tutoSubState = 1; tutoTimer = 0; customLetterSpawnIndex = 0; }
      );
    } else if (tutoSubState === 1) {
      tutoInstructionMessage = "Attrape toutes les lettres pour former R O G E R !";
      
      if (items.length === 0 && obstacles.length === 0 && platforms.length === 0 && tutoTimer > 40) {
        tutoTimer = 0;
        if (customLetterSpawnIndex === 0) {
          items.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 120, w: 65, h: 75, char: 'R', letterIdx: 0, frame: 0, animTimer: 0 });
          const conf = assets.obstaclesConfig[5]; const dim = getObstacleDimensions(conf);
          obstacles.push({ x: canvas.width + 250, y: ENTITY_GROUND_Y - dim.h + 5, w: dim.w, h: dim.h, configIdx: 5, frame: 0, animTimer: 0 });
          customLetterSpawnIndex = 1;
        } else if (customLetterSpawnIndex === 1) {
          items.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 120, w: 65, h: 75, char: 'O', letterIdx: 1, frame: 0, animTimer: 0 });
          const conf = assets.obstaclesConfig[3]; const dim = getObstacleDimensions(conf);
          obstacles.push({ x: canvas.width + 280, y: ENTITY_GROUND_Y - 100 - dim.h + 20, w: dim.w, h: dim.h, configIdx: 3, frame: 0, animTimer: 0 });
          platforms.push({ x: canvas.width + 230, y: ENTITY_GROUND_Y - 100, w: 260, h: 65, key: 'bleu_medium' });
          customLetterSpawnIndex = 2;
        } else if (customLetterSpawnIndex === 2) {
          // Lettre G sur une plateforme BEAUCOUP PLUS HAUTE
          items.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 240, w: 65, h: 75, char: 'G', letterIdx: 2, frame: 0, animTimer: 0 });
          platforms.push({ x: canvas.width + 20, y: ENTITY_GROUND_Y - 200, w: 260, h: 65, key: 'bleu_medium' });
          customLetterSpawnIndex = 3;
        } else if (customLetterSpawnIndex === 3) {
          items.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 120, w: 65, h: 75, char: 'E', letterIdx: 3, frame: 0, animTimer: 0 });
          const conf = assets.obstaclesConfig[5]; const dim = getObstacleDimensions(conf);
          obstacles.push({ x: canvas.width + 250, y: ENTITY_GROUND_Y - dim.h + 5, w: dim.w, h: dim.h, configIdx: 5, frame: 0, animTimer: 0 });
          customLetterSpawnIndex = 4;
        } else if (customLetterSpawnIndex === 4) {
          // Dernier obstacle volant AVANT la dernière lettre R
          items.push({ x: canvas.width + 320, y: ENTITY_GROUND_Y - 120, w: 65, h: 75, char: 'R', letterIdx: 4, frame: 0, animTimer: 0 });
          const conf = assets.obstaclesConfig[7]; const dim = getObstacleDimensions(conf);
          obstacles.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - dim.h - 70, w: dim.w, h: dim.h, configIdx: 7, frame: 0, animTimer: 0, baseY: ENTITY_GROUND_Y - dim.h - 70 });
          platforms.push({ x: canvas.width + 270, y: ENTITY_GROUND_Y - 130, w: 260, h: 65, key: 'bleu_medium' });
          customLetterSpawnIndex = 5;
        }
      }

      if (completedWordsCount >= 2 && customLetterSpawnIndex === 5) {
        tutoSubState = 2;
        endSequenceTimer = 0;
        tutoInstructionMessage = "";
        obstacles = []; platforms = []; items = [];
      }
    } else if (tutoSubState === 2) {
      endSequenceTimer++;
      if (endSequenceTimer > 120) {
        // Fenêtre finale centrée en plein milieu sans zone de focus
        showTutoDialogSide(
          "Tu connais désormais les bases pour jouer à Good Morning Roger Sk8in' Cat. Lance-toi, plein d'autres surprises t'attendent dans le jeu !",
          null, // Pas de focus rectangulaire -> centrage automatique
          () => { location.reload(); }
        );
        tutoSubState = 3;
      }
    }
  }
}

function updatePlatformStream() {
  if (!gameStarted) return;
  if (tutoStep === 4 && platforms.length === 0) {
    platforms.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 130, w: 260, h: 65, key: 'bleu_medium', wasOnPlat: false, descendedFromPlat: false, touchedPlatform: false });
  }
}

function update() {
  if (!gameStarted) { stopRunSound(); return; }

  const now = Date.now();
  if (!tutoHighlightedZone && now - lastScoreTime >= 1000) { 
    score += 50; 
    lastScoreTime = now; 
  }

  if (cat.damageFlashTimer > 0) cat.damageFlashTimer--;

  updatePlatformStream();
  updateTutorialScript();
  if (tutoHighlightedZone) { stopRunSound(); return; }

  bounceTimer += 0.08;
  const jumpPressed = !!(keys['Space'] || keys['ArrowUp']);
  const downPressed = !!keys['ArrowDown'];

  bgX -= currentGameSpeed * 0.4;

  if (downPressed && cat.isPlatformGrounded) {
    cat.y += 12; cat.isGrounded = false; cat.isPlatformGrounded = false; stopRunSound();
  }
  if (jumpPressed && cat.isGrounded) {
    cat.vy = JUMP_FORCE; cat.isGrounded = false; cat.isPlatformGrounded = false; cat.isJumping = true; cat.jumpTimer = 0; cat.state = 'RUN'; 
    stopRunSound(); playSoundEffect(sounds.jump);
  }
  if (jumpPressed && cat.isJumping) {
    if (cat.jumpTimer < MAX_JUMP_TIME) { cat.vy += JUMP_HOLD_FORCE; cat.jumpTimer++; }
  }
  cat.isCrouching = downPressed;
  if (cat.isCrouching) { cat.crouchTimer++; if (cat.crouchTimer % 6 === 0) cat.crouchFrame = (cat.crouchFrame + 1) % 3; } 
  else { cat.crouchFrame = 0; cat.crouchTimer = 0; }
  cat.vy += GRAVITY; cat.y += cat.vy;

  let catBoxX = cat.x + 25; let catBoxWidth = cat.width - 50; 
  let catBoxY = cat.isCrouching ? cat.y + 70 : cat.y + 12; 
  let catBoxHeight = cat.isCrouching ? 32 : cat.height - 24;

  cat.wasGrounded = cat.isGrounded; cat.isGrounded = false; cat.isPlatformGrounded = false;
  if (cat.y + cat.height >= ENTITY_GROUND_Y) { 
    cat.y = ENTITY_GROUND_Y - cat.height; cat.vy = 0; cat.isGrounded = true; cat.isJumping = false; 
  }
  if (!downPressed || cat.vy < 0) {
    platforms.forEach(p => {
      const depthOffset = 14; const surfaceY = p.y + depthOffset;
      if (cat.x + cat.width > p.x && cat.x < p.x + p.w && cat.y + cat.height >= surfaceY && cat.y + cat.height <= surfaceY + 20 && cat.vy >= 0) {
        cat.y = surfaceY - cat.height + 6; 
        cat.vy = 0; cat.isGrounded = true; cat.isPlatformGrounded = true; cat.isJumping = false;
      }
    });
  }

  platforms.forEach(p => p.x -= currentGameSpeed);
  if (!cat.wasGrounded && cat.isGrounded) playSoundEffect(sounds.reception);
  if (cat.isGrounded) playRunSound(); else stopRunSound();
  platforms = platforms.filter(p => p.x + p.w > -100);

  obstacles.forEach(o => {
    o.x -= currentGameSpeed;
    o.animTimer++; 
    if (o.animTimer % 10 === 0) o.frame = (o.frame + 1) % 3;
    
    if (o.configIdx === 7 && o.baseY !== undefined) {
      o.y = o.baseY + Math.sin(o.animTimer * 0.1) * 20;
    }

    let obsBoxX = o.x + 10; let obsBoxWidth = Math.max(10, o.w - 20); 
    let obsBoxY = o.y + 10; let obsBoxHeight = Math.max(10, o.h - 20);

    const isHit = (catBoxX < obsBoxX + obsBoxWidth && catBoxX + catBoxWidth > obsBoxX && catBoxY < obsBoxY + obsBoxHeight && catBoxY + catBoxHeight > obsBoxY);
    if (isHit && cat.damageFlashTimer === 0) {
      playSoundEffect(sounds.damage);
      cat.damageFlashTimer = 30; 
      
      if (tutoStep === 5) {
        tutoObstacleCount = 0;
        obstacles = [];
        platforms = [];
        tutoTimer = 0;
        return;
      } else if (tutoStep === 6) {
        completedWordsCount = 1; 
        return;
      } else if (tutoStep === 7) {
        tutoSubState = 0;
        obstacles = [];
        platforms = [];
        items = [];
        customLetterSpawnIndex = 0;
        rogerCollected = [false, false, false, false, false];
      }
    }
  });
  obstacles = obstacles.filter(o => o.x + o.w > -100);

  items.forEach(it => {
    it.x -= currentGameSpeed; it.animTimer++; if (it.animTimer % 6 === 0) it.frame = (it.frame + 1) % 8;
    const itemHit = (catBoxX < it.x + it.w && catBoxX + catBoxWidth > it.x && catBoxY < it.y + it.h && catBoxY + catBoxHeight > it.y);
    if (itemHit) {
      score += 100; it.collected = true; playSoundEffect(sounds.coin);
      rogerCollected[it.letterIdx] = true;
      if (rogerCollected.every(Boolean)) {
        completedWordsCount = 2; 
        rogerCollected = [false, false, false, false, false];
      }
    }
  });
  items = items.filter(it => !it.collected && it.x + it.w > -100);

  cat.animTimer++; if (cat.animTimer % 14 === 0) cat.animFrame = (cat.animFrame + 1) % 4;
}

function drawShadow(centerX, centerY, radiusX, radiusY, opacity = 0.35) {
  ctx.save(); ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`; ctx.beginPath();
  ctx.ellipse(Math.round(centerX), Math.round(centerY), Math.round(radiusX), Math.round(radiusY), 0, 0, Math.PI * 2);
  ctx.fill(); ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.textAlign = 'left';

  if (assets.bg.complete && assets.bg.naturalWidth > 0) {
    const availableHeight = GROUND_Y; const bgScale = availableHeight / assets.bg.naturalHeight;
    const bgScaledWidth = assets.bg.naturalWidth * bgScale; const currentBgX = Math.round(bgX % bgScaledWidth);
    ctx.drawImage(assets.bg, currentBgX, 0, Math.round(bgScaledWidth), availableHeight);
    ctx.drawImage(assets.bg, Math.round(currentBgX + bgScaledWidth), 0, Math.round(bgScaledWidth), availableHeight);
    if (currentBgX + bgScaledWidth < canvas.width) ctx.drawImage(assets.bg, Math.round(currentBgX + (bgScaledWidth * 2)), 0, Math.round(bgScaledWidth), availableHeight);
  } else { ctx.fillStyle = '#1a1a24'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

  ctx.fillStyle = '#000000'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  platforms.forEach(p => {
    const img = assets.platforms[p.key]; const px = Math.round(p.x), py = Math.round(p.y), pw = Math.round(p.w), ph = Math.round(p.h);
    if (img && img.complete && img.naturalWidth > 0) ctx.drawImage(img, px, py, pw, ph);
    else { ctx.fillStyle = '#4fc3f7'; ctx.fillRect(px, py, pw, ph); }
  });

  let shadowTargetY = ENTITY_GROUND_Y;
  platforms.forEach(p => { const surfaceY = p.y + 14; if (cat.x + cat.width > p.x && cat.x < p.x + p.w && cat.y + cat.height <= surfaceY + 20) shadowTargetY = surfaceY; });
  const jumpDistance = Math.max(0, shadowTargetY - (cat.y + cat.height));
  drawShadow(cat.x + cat.width / 2, shadowTargetY, Math.max(12, 35 - (jumpDistance * 0.12)), 6, 0.35);

  obstacles.forEach(o => {
    const conf = assets.obstaclesConfig[o.configIdx]; let imgToDraw = (conf.type === 'anim') ? conf.frames[o.frame] : conf.img;
    const ox = Math.round(o.x), oy = Math.round(o.y), ow = Math.round(o.w), oh = Math.round(o.h);
    
    if (o.configIdx === 7) {
      drawShadow(ox + ow / 2, ENTITY_GROUND_Y, ow * 0.35, 5, 0.3);
    }

    if (imgToDraw && imgToDraw.complete && imgToDraw.naturalWidth > 0) {
      ctx.drawImage(imgToDraw, ox, oy, ow, oh);
    } else { ctx.fillStyle = '#ff9800'; ctx.fillRect(ox, oy, ow, oh); }
  });

  if (cat.damageFlashTimer === 0 || Math.floor(cat.damageFlashTimer / 4) % 2 === 0) {
    let catSprite;
    if (!cat.isGrounded) catSprite = assets.cat.jump[Math.min(1, cat.animFrame % 3)];
    else if (cat.isCrouching) catSprite = assets.cat.crouchSequence[cat.crouchFrame % 3];
    else catSprite = assets.cat.runSequence[cat.animFrame % 4];

    let drawWidth = cat.width, drawHeight = cat.height, drawX = cat.x, drawY = cat.y;
    if (catSprite && catSprite.complete && catSprite.naturalWidth > 0) {
      const spriteRatio = catSprite.naturalWidth / catSprite.naturalHeight;
      if (cat.isCrouching) {
        drawWidth = cat.width * 1.3 * 0.85; drawHeight = drawWidth / spriteRatio; drawY = cat.y + (cat.height - drawHeight);
      }
      ctx.drawImage(catSprite, Math.round(drawX), Math.round(drawY), Math.round(drawWidth), Math.round(drawHeight));
    } else { ctx.fillStyle = '#ab47bc'; ctx.fillRect(Math.round(cat.x), Math.round(cat.y), Math.round(cat.width), Math.round(cat.height)); }
  }

  ctx.save(); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  items.forEach(it => {
    const letterFrames = assets.letters[it.char]; const img = letterFrames ? letterFrames[it.frame] : null;
    const ix = Math.round(it.x), iy = Math.round(it.y), iw = Math.round(it.w), ih = Math.round(it.h);
    if (img && img.complete && img.naturalWidth > 0) ctx.drawImage(img, ix, iy, iw, ih);
    else { ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(ix + iw/2, iy + ih/2, 28, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000'; ctx.font = 'bold 28px Courier New'; ctx.fillText(it.char, ix + 20, iy + 45); }
  });
  ctx.restore();

  // HUD SCORE
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(20, 20, 220, 45);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Courier New'; ctx.fillText(`SCORE: ${score}`, 32, 50);

  // HUD CONTRÔLES
  const hudWidth = isMobileDevice ? 260 : 320; const hudXPos = isMobileDevice ? canvas.width - 370 : canvas.width - 340;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(hudXPos, 20, hudWidth, 80);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(hudXPos, 20, hudWidth, 80);
  ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 13px Courier New';
  if (isMobileDevice) { ctx.fillText("TAP DROITE : SAUTER", hudXPos + 15, 42); ctx.fillText("TAP GAUCHE : BAISSER", hudXPos + 15, 62); }
  else { ctx.fillText("ESPACE : SAUTER | BAS : BAISSER", hudXPos + 15, 42); ctx.fillText("ENTRÉE : PAUSE", hudXPos + 15, 62); ctx.fillText("ECHAP  : ACCUEIL", hudXPos + 15, 80); }

  // PETITES LETTRES EN BAS À DROITE
  const hudX = canvas.width - 340; const hudY = canvas.height - 85;
  ctx.fillStyle = '#000000'; ctx.fillRect(hudX - 10, hudY - 10, 335, 80);
  ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.strokeRect(hudX - 10, hudY - 10, 335, 80);
  rogerLetters.forEach((char, idx) => {
    const slotX = hudX + (idx * 64); const isCollected = rogerCollected[idx]; const hudImg = assets.letters[char] ? assets.letters[char][0] : null;
    if (hudImg && hudImg.complete && hudImg.naturalWidth > 0) { ctx.globalAlpha = isCollected ? 1.0 : 0.25; ctx.drawImage(hudImg, slotX, hudY, 52, 60); ctx.globalAlpha = 1.0; }
    else { ctx.fillStyle = isCollected ? '#ffd54f' : '#555'; ctx.font = 'bold 36px Courier New'; ctx.fillText(char, slotX + 14, hudY + 44); }
  });

  // GROSSES LETTRES EN BAS À GAUCHE
  const masterHudX = 20; const masterHudY = canvas.height - 115;
  rogerLetters.forEach((char, idx) => {
    const slotX = masterHudX + (idx * 95); const isWordCompleted = idx < completedWordsCount;
    if (isWordCompleted) {
      const hudImg = assets.letters[char] ? assets.letters[char][0] : null;
      const currentY = Math.round(masterHudY);
      if (hudImg && hudImg.complete && hudImg.naturalWidth > 0) ctx.drawImage(hudImg, slotX, currentY, 90, 105);
      else { ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 64px Courier New'; ctx.fillText(char, slotX + 15, currentY + 75); }
    }
  });

  // MESSAGE D'INSTRUCTION EN JEU (BANDEAU CANVAS CORRIGÉ : CENTRAGE VERTICAL PARFAIT, NON COUPÉ)
  if (tutoInstructionMessage && tutoDialogBox.style.display !== 'block') {
    ctx.save(); 
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; 
    ctx.fillRect(canvas.width / 2 - 380, 75, 760, 55);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 380, 75, 760, 55);
    ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'center';
    ctx.textBaseline = 'middle'; // Fixe définitivement le rendu sans rognage haut
    
    const maxLineLength = 70;
    if (tutoInstructionMessage.length > maxLineLength) {
      let spaceIdx = tutoInstructionMessage.lastIndexOf(' ', maxLineLength);
      if (spaceIdx === -1) spaceIdx = maxLineLength;
      const line1 = tutoInstructionMessage.substring(0, spaceIdx);
      const line2 = tutoInstructionMessage.substring(spaceIdx + 1);
      ctx.fillText(line1, canvas.width / 2, 95);
      ctx.fillText(line2, canvas.width / 2, 115);
    } else {
      ctx.fillText(tutoInstructionMessage, canvas.width / 2, 102);
    }
    ctx.restore();
  }

  // MASQUE DE FREEZE ET SURBRILLANCE (OU ASSOMBRISSEMENT GLOBAL SI PAS DE FOCUS)
  if (tutoDialogBox.style.display === 'block') {
    ctx.save(); 
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; 
    if (tutoHighlightedZone) {
      const z = tutoHighlightedZone;
      ctx.fillRect(0, 0, canvas.width, z.y);
      ctx.fillRect(0, z.y, z.x, z.h);
      ctx.fillRect(z.x + z.w, z.y, canvas.width - (z.x + z.w), z.h);
      ctx.fillRect(0, z.y + z.h, canvas.width, canvas.height - (z.y + z.h));
      ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3; ctx.strokeRect(z.x, z.y, z.w, z.h);
    } else {
      // Pas de zone ciblée -> Assombrissement global pour la fenêtre centrée finale
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.restore();
  }
}

let lastFrameTime = performance.now();
function gameLoop(currentTime) {
  requestAnimationFrame(gameLoop); const deltaTime = currentTime - lastFrameTime;
  if (deltaTime < 10) return;
  lastFrameTime = currentTime; update(); draw();
}

requestAnimationFrame(gameLoop);
</script>
</body>
