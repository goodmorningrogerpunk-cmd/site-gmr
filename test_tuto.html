<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skate Cat - Tutoriel Rigoureux</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #000; font-family: 'Courier New', Courier, monospace; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    #game-container {
      position: relative; width: 960px; height: 540px;
      border: 4px solid #2e2e40; background: #000; border-radius: 8px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

    #tuto-main-btn {
      position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%);
      padding: 16px 32px; font-size: 20px; color: #ffffff; background-color: #2e2e40;
      border: 3px solid #ffd54f; cursor: pointer; font-weight: bold; z-index: 10;
    }
    #tuto-main-btn:hover { background-color: #ffd54f; color: #1a1a24; }

    #version-display {
      position: absolute; bottom: 12px; right: 15px; font-size: 13px; font-weight: bold;
      color: #ffd54f; background: rgba(0, 0, 0, 0.75); padding: 4px 8px; border: 1px solid #ffd54f;
      border-radius: 4px; pointer-events: none; z-index: 30;
    }

    #tuto-dialog-box {
      display: none; position: absolute;
      width: 380px; background: #111118; border: 4px solid #ffd54f; border-radius: 8px;
      padding: 18px; z-index: 50; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    #tuto-dialog-text { font-size: 14px; line-height: 1.5; color: #ffffff; margin-bottom: 16px; text-align: left; }
    #tuto-next-btn { padding: 8px 24px; font-size: 15px; color: #1a1a24; background-color: #ffd54f; border: 3px solid #ffffff; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <button id="tuto-main-btn">LANCER LE TUTORIEL</button>
  <div id="version-display">v5.1-FIX</div>

  <div id="tuto-dialog-box">
    <p id="tuto-dialog-text"></p>
    <button id="tuto-next-btn">SUIVANT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const tutoMainBtn = document.getElementById('tuto-main-btn');
const tutoDialogBox = document.getElementById('tuto-dialog-box');
const tutoDialogText = document.getElementById('tuto-dialog-text');
const tutoNextBtn = document.getElementById('tuto-next-btn');

const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                 || (window.matchMedia && window.matchMedia("(max-width: 900px) and (pointer: coarse)").matches);

const bgMusic = new Audio('roger_8bitok.mp3'); bgMusic.loop = true; bgMusic.volume = 0.6;
const sounds = { jump: new Audio('skate_jump.mp3'), reception: new Audio('skate_reception.mp3'), coin: new Audio('coin_receive.mp3'), damage: new Audio('damage.mp3') };

const ASSET_VERSION = 'v5.1';
function loadImg(name) { const img = new Image(); img.src = name + '.png?v=' + ASSET_VERSION; return img; }

const assets = {
  bg: loadImg('background4'),
  catRun: [loadImg('chat_push2'), loadImg('chat_run'), loadImg('chat_run1'), loadImg('chat_run3')],
  catJump: [loadImg('chat_jump1'), loadImg('chat_jump2')],
  catCrouch: [loadImg('chat_reception2'), loadImg('chat_reception2-1')],
  platMedium: loadImg('bleu_medium'),
  obstaclesConfig: [
    { img: loadImg('obstacle4'), targetH: 75 },
    { img: loadImg('obstacle6'), targetH: 85 }
  ],
  letters: {
    R: Array.from({length: 8}, (_, i) => loadImg(`R${i+1}`)),
    O: Array.from({length: 8}, (_, i) => loadImg(`O${i+1}`)),
    G: Array.from({length: 8}, (_, i) => loadImg(`G${i+1}`)),
    E: Array.from({length: 8}, (_, i) => loadImg(`E${i+1}`))
  }
};

const GROUND_Y = 430;
const ENTITY_GROUND_Y = 418;
const GRAVITY = 0.8;
const JUMP_FORCE = -12;
const JUMP_HOLD_FORCE = -0.55;
const MAX_JUMP_TIME = 15;

let gameStarted = false;
let score = 0;
let bgX = 0;
let cat = { x: 150, y: ENTITY_GROUND_Y - 110, width: 110, height: 110, vy: 0, isGrounded: true, isCrouching: false, jumpTimer: 0, isJumping: false, animFrame: 0 };
let keys = {};

let tutoStep = 0;
let tutoSubState = 0;
let tutoHighlightedZone = null;
let tutoNextCallback = null;
let tutoInstructionMessage = "";
let tutoObstacleCount = 0;

let completedWordsCount = 2;
const rogerLetters = ['R', 'O', 'G', 'E', 'R'];
let platforms = [];
let obstacles = [];
let items = [];

window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'Enter'].includes(e.code)) e.preventDefault();
  if (tutoDialogBox.style.display === 'block' && (e.code === 'Space' || e.code === 'Enter')) {
    tutoNextBtn.click();
    return;
  }
  keys[e.code] = true;
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp') cat.isJumping = false;
});

tutoMainBtn.addEventListener('click', () => {
  bgMusic.play().catch(() => {});
  tutoMainBtn.style.display = 'none';
  gameStarted = true;
  
  // Délai d'une seconde avant de déclencher la première étape (laisse le chat rouler)
  setTimeout(() => {
    startStep1();
  }, 1000);
});

tutoNextBtn.addEventListener('click', () => {
  tutoDialogBox.style.display = 'none';
  tutoHighlightedZone = null;
  if (tutoNextCallback) {
    const cb = tutoNextCallback;
    tutoNextCallback = null;
    cb();
  }
});

function showDialogNear(text, targetX, targetY, highlightRect, onNext) {
  tutoDialogText.innerHTML = text;
  tutoHighlightedZone = highlightRect;
  tutoNextCallback = onNext;
  
  tutoDialogBox.style.display = 'block';
  let leftPos = targetX - 400;
  if (leftPos < 20) leftPos = targetX + highlightRect.w + 20;
  if (leftPos > 560) leftPos = 280;
  
  let topPos = targetY - 40;
  if (topPos < 20) topPos = 20;
  if (topPos > 320) topPos = 150;

  tutoDialogBox.style.left = leftPos + 'px';
  tutoDialogBox.style.top = topPos + 'px';
  tutoDialogBox.style.transform = 'none';
}

function startStep1() {
  tutoStep = 1;
  showDialogNear(
    "Ceci est ton score, le but est d'avoir le maximum de points. Plus tu avances loin, plus ton score augmente. Des bonus peuvent aussi te faire gagner des points.",
    20, 20,
    { x: 15, y: 15, w: 230, h: 55 },
    () => { startStep2(); }
  );
}

function startStep2() {
  tutoStep = 2;
  const controlsText = isMobileDevice ?
    "En appuyant sur le <b>CÔTÉ DROIT DE L'ÉCRAN</b>, Roger fait un saut (appui court = petit saut, appui long = grand saut). En appuyant sur le <b>CÔTÉ GAUCHE DE L'ÉCRAN</b>, Roger se baisse. Utilise les boutons HUD pour la pause et l'accueil." :
    "En appuyant sur \"ESPACE\", Roger fait un saut avec son skate. Si tu fais un appui court, il fait un petit saut. Si tu fais un appui long il fait un plus grand saut. En appuyant sur la \"FLÈCHE DU BAS\", Roger se baisse. Pour mettre le jeu en pause, appuie sur \"ENTRÉE\" et pour revenir à l'écran principal appuie sur \"ÉCHAP\".";

  showDialogNear(
    controlsText,
    canvas.width - 340, 20,
    { x: canvas.width - 340, y: 15, w: 320, h: 80 },
    () => { startStep3(); }
  );
}

function startStep3() {
  tutoStep = 3;
  tutoSubState = 1;
}

function startStep4() {
  tutoStep = 4;
  tutoSubState = 1;
  // Plateforme initialisée hors champ qui avance vers x = 450
  platforms.push({ x: 900, targetX: 450, y: ENTITY_GROUND_Y - 110, w: 260, h: 65, active: false });
}

function triggerPlatformStep() {
  const plat = platforms[0];
  const actionText = isMobileDevice ? "Ceci est une plateforme, il en existe de différentes tailles et de différentes hauteurs. Tu peux sauter dessus mais aussi en descendre ou passer au travers en appuyant sur le CÔTÉ GAUCHE." : "Ceci est une plateforme, il en existe de différentes tailles et de différentes hauteurs. Tu peux sauter dessus mais aussi en descendre ou passer au travers en appuyant sur FLÈCHE DU BAS.";
  
  showDialogNear(
    actionText,
    plat.x, plat.y,
    { x: plat.x - 5, y: plat.y - 5, w: plat.w + 10, h: plat.h + 10 },
    () => { tutoSubState = 2; }
  );
}

function startStep5() {
  tutoStep = 5;
  tutoSubState = 1;
  tutoObstacleCount = 0;
  
  showDialogNear(
    "Ça c'est un obstacle, il faut l'éviter, en sautant par dessus ou en passant en dessous.",
    480, ENTITY_GROUND_Y - 100,
    { x: 460, y: ENTITY_GROUND_Y - 85, w: 90, h: 85 },
    () => { tutoSubState = 2; }
  );
}

function startStep6() {
  tutoStep = 6;
  showDialogNear(
    "Ces GROSSES lettres R O G E R te protègent d'un choc avec un obstacle.",
    20, canvas.height - 130,
    { x: 15, y: canvas.height - 125, w: 480, h: 110 },
    () => {
      tutoSubState = 1;
      obstacles.push({ x: 850, y: ENTITY_GROUND_Y - 75, w: 70, h: 75 });
    }
  );
}

function startStep7() {
  tutoStep = 7;
  showDialogNear(
    "Collecte ces lettres afin de compléter le mot R O G E R en bas à droite, cela te fera gagner une GROSSE lettre.",
    canvas.width - 340, canvas.height - 100,
    { x: canvas.width - 340, y: canvas.height - 95, w: 320, h: 85 },
    () => {
      tutoSubState = 1;
      items.push({ x: 850, y: ENTITY_GROUND_Y - 120, w: 65, h: 75, char: 'R' });
    }
  );
}

function update() {
  if (!gameStarted || tutoDialogBox.style.display === 'block') return;

  bgX -= 3;

  const jumpPressed = !!(keys['Space'] || keys['ArrowUp']);
  const downPressed = !!keys['ArrowDown'];

  if (jumpPressed && cat.isGrounded) {
    cat.vy = JUMP_FORCE;
    cat.isGrounded = false;
    cat.isJumping = true;
    cat.jumpTimer = 0;
    try { sounds.jump.currentTime = 0; sounds.jump.play(); } catch(e){}
  }
  if (jumpPressed && cat.isJumping && cat.jumpTimer < MAX_JUMP_TIME) {
    cat.vy += JUMP_HOLD_FORCE;
    cat.jumpTimer++;
  }
  cat.isCrouching = downPressed;
  cat.vy += GRAVITY;
  cat.y += cat.vy;

  if (cat.y + cat.height >= ENTITY_GROUND_Y) {
    if (!cat.isGrounded) try { sounds.reception.currentTime = 0; sounds.reception.play(); } catch(e){}
    cat.y = ENTITY_GROUND_Y - cat.height;
    cat.vy = 0;
    cat.isGrounded = true;
    cat.isJumping = false;
  }

  cat.animFrame++;

  if (tutoStep === 3) {
    if (tutoSubState === 1) {
      tutoInstructionMessage = "Vas-y essaie de sauter loin (appui long)";
      if (!cat.isGrounded && cat.jumpTimer >= 10) tutoSubState = 2;
    } else if (tutoSubState === 2) {
      tutoInstructionMessage = "Maintenant baisse toi";
      if (cat.isCrouching) tutoSubState = 3;
    } else if (tutoSubState === 3) {
      tutoInstructionMessage = "Et pour finir, fais un tout petit saut (appui court)";
      if (cat.isGrounded && cat.vy === 0 && cat.jumpTimer > 0 && cat.jumpTimer < 8) {
        tutoInstructionMessage = "";
        startStep4();
      }
    }
  } 
  else if (tutoStep === 4) {
    const plat = platforms[0];
    if (plat) {
      if (plat.x > plat.targetX) {
        plat.x -= 3; // Avance vers sa position fixe
      } else if (!plat.active) {
        plat.active = true;
        triggerPlatformStep(); // Déclenche le pop-up pile au bon endroit statique
      }
    }

    if (tutoSubState === 2) {
      tutoInstructionMessage = "Saute sur la plateforme";
      if (plat && cat.x + cat.width > plat.x && cat.x < plat.x + plat.w && cat.y + cat.height <= plat.y + 15 && cat.vy >= 0) {
        cat.y = plat.y - cat.height; cat.vy = 0; cat.isGrounded = true;
        tutoSubState = 3;
      }
    } else if (tutoSubState === 3) {
      tutoInstructionMessage = "Saute sur la plateforme puis descends de la plateforme";
      if (cat.y > plat.y + 20) {
        tutoSubState = 4;
      }
    } else if (tutoSubState === 4) {
      tutoInstructionMessage = "Maintenant, passe au travers de la plateforme";
      if (cat.y < plat.y && cat.isCrouching && cat.vy > 0 && cat.x + cat.width > plat.x && cat.x < plat.x + plat.w) {
        tutoInstructionMessage = "";
        platforms = [];
        startStep5();
      }
    }
  }
  else if (tutoStep === 5 && tutoSubState === 2) {
    tutoInstructionMessage = `Évite les obstacles ! (${tutoObstacleCount}/4)`;
    if (obstacles.length === 0) {
      obstacles.push({ x: canvas.width + 50, y: ENTITY_GROUND_Y - 75, w: 70, h: 75 });
    }
    obstacles.forEach(o => o.x -= 4);
    
    if (obstacles.length > 0) {
      let o = obstacles[0];
      if (o.x + o.w < cat.x && !o.passed) {
        o.passed = true;
        tutoObstacleCount++;
        obstacles = [];
        if (tutoObstacleCount >= 4) {
          tutoInstructionMessage = "";
          startStep6();
        }
      }
    }
  }
  else if (tutoStep === 6 && tutoSubState === 1) {
    tutoInstructionMessage = "Vas-y fonce sur un obstacle. C'est pour le TUTO, ne le fais pas dans une vraie partie !";
    obstacles.forEach(o => o.x -= 4);
    if (obstacles.length > 0) {
      let o = obstacles[0];
      if (cat.x < o.x + o.w && cat.x + cat.width > o.x && cat.y < o.y + o.h && cat.y + cat.height > o.y) {
        try { sounds.damage.currentTime = 0; sounds.damage.play(); } catch(e){}
        completedWordsCount = 1;
        obstacles = [];
        tutoInstructionMessage = "";
        startStep7();
      }
    }
  }
  else if (tutoStep === 7 && tutoSubState === 1) {
    tutoInstructionMessage = "Attrape toutes les lettres pour former R O G E R !";
    items.forEach(it => it.x -= 4);
    if (items.length > 0) {
      let it = items[0];
      if (cat.x < it.x + it.w && cat.x + cat.width > it.x && cat.y < it.y + it.h && cat.y + cat.height > it.y) {
        try { sounds.coin.currentTime = 0; sounds.coin.play(); } catch(e){}
        completedWordsCount = 2;
        items = [];
        tutoInstructionMessage = "";
        
        showDialogNear(
          "Tu connais désormais les bases pour jouer à Good Morning Roger Sk8in' Cat. Lance toi, plein d'autres surprises t'attendent dans le jeu !",
          canvas.width / 2 - 190, canvas.height / 2 - 60,
          { x: canvas.width / 2 - 200, y: canvas.height / 2 - 70, w: 400, h: 140 },
          () => { location.reload(); }
        );
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (assets.bg.complete && assets.bg.naturalWidth > 0) {
    const bgScale = GROUND_Y / assets.bg.naturalHeight;
    const bgW = assets.bg.naturalWidth * bgScale;
    const currentX = Math.round(bgX % bgW);
    ctx.drawImage(assets.bg, currentX, 0, bgW, GROUND_Y);
    ctx.drawImage(assets.bg, currentX + bgW, 0, bgW, GROUND_Y);
  } else {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, GROUND_Y);
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  if (!gameStarted) return;

  platforms.forEach(p => {
    if (assets.platMedium.complete && assets.platMedium.naturalWidth > 0) {
      ctx.drawImage(assets.platMedium, p.x, p.y, p.w, p.h);
    } else {
      ctx.fillStyle = '#4fc3f7'; ctx.fillRect(p.x, p.y, p.w, p.h);
    }
  });

  obstacles.forEach(o => {
    if (assets.obstaclesConfig[0].img.complete && assets.obstaclesConfig[0].img.naturalWidth > 0) {
      ctx.drawImage(assets.obstaclesConfig[0].img, o.x, o.y, o.w, o.h);
    } else {
      ctx.fillStyle = '#ff5252'; ctx.fillRect(o.x, o.y, o.w, o.h);
    }
  });

  items.forEach(it => {
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(it.x + it.w/2, it.y + it.h/2, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 28px Courier New'; ctx.fillText(it.char, it.x + 18, it.y + 46);
  });

  let catImg = assets.catRun[Math.floor(cat.animFrame / 10) % 4];
  if (!cat.isGrounded) catImg = assets.catJump[0];
  else if (cat.isCrouching) catImg = assets.catCrouch[0];

  if (catImg && catImg.complete && catImg.naturalWidth > 0) {
    ctx.drawImage(catImg, cat.x, cat.y, cat.width, cat.height);
  } else {
    ctx.fillStyle = '#ab47bc'; ctx.fillRect(cat.x, cat.y, cat.width, cat.height);
  }

  // HUD Score
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(20, 20, 220, 45);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Courier New'; ctx.fillText(`SCORE: ${score}`, 32, 50);

  // HUD Contrôles
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(canvas.width - 340, 20, 320, 80);
  ctx.strokeStyle = '#fff'; ctx.strokeRect(canvas.width - 340, 20, 320, 80);
  ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 13px Courier New';
  ctx.fillText("ESPACE : SAUTER | BAS : BAISSER", canvas.width - 335, 42);
  ctx.fillText("ENTRÉE : PAUSE", canvas.width - 335, 62);
  ctx.fillText("ÉCHAP  : ACCUEIL", canvas.width - 335, 82);

  // HUD Petites lettres ROGER en bas à droite
  const hudX = canvas.width - 340; const hudY = canvas.height - 85;
  ctx.fillStyle = '#000000'; ctx.fillRect(hudX - 10, hudY - 10, 335, 80);
  ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.strokeRect(hudX - 10, hudY - 10, 335, 80);
  
  rogerLetters.forEach((char, idx) => {
    const slotX = hudX + (idx * 64);
    const isCollected = (idx < completedWordsCount);
    const letterFrames = assets.letters[char];
    const img = letterFrames ? letterFrames[0] : null;
    
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.globalAlpha = isCollected ? 1.0 : 0.25;
      ctx.drawImage(img, slotX + 6, hudY + 4, 42, 52);
      ctx.globalAlpha = 1.0;
    } else {
      ctx.fillStyle = isCollected ? '#ffd54f' : '#555'; ctx.font = 'bold 36px Courier New';
      ctx.fillText(char, slotX + 14, hudY + 44);
    }
  });

  // HUD GROSSES lettres ROGER (en bas à gauche)
  const masterHudX = 20; const masterHudY = canvas.height - 115;
  rogerLetters.forEach((char, idx) => {
    const slotX = masterHudX + (idx * 95);
    const isCollected = idx < completedWordsCount;
    if (isCollected) {
      const letterImg = assets.letters[char] ? assets.letters[char][0] : null;
      if (letterImg && letterImg.complete && letterImg.naturalWidth > 0) {
        ctx.drawImage(letterImg, slotX, masterHudY, 90, 105);
      } else {
        ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 64px Courier New'; ctx.fillText(char, slotX + 15, masterHudY + 75);
      }
    }
  });

  // Écran grisé et surbrillance (si pop-up active)
  if (tutoHighlightedZone && tutoDialogBox.style.display === 'block') {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    const z = tutoHighlightedZone;
    ctx.fillRect(0, 0, canvas.width, z.y);
    ctx.fillRect(0, z.y, z.x, z.h);
    ctx.fillRect(z.x + z.w, z.y, canvas.width - (z.x + z.w), z.h);
    ctx.fillRect(0, z.y + z.h, canvas.width, canvas.height - (z.y + z.h));

    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3; ctx.strokeRect(z.x, z.y, z.w, z.h);
    ctx.restore();
  }

  // Message d'instruction en jeu
  if (tutoInstructionMessage && tutoDialogBox.style.display !== 'block') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(canvas.width / 2 - 340, 85, 680, 45);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 340, 85, 680, 45);
    ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(tutoInstructionMessage, canvas.width / 2, 113); ctx.textAlign = 'left';
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
